name: Demo CICD Multi-Stage Deployment

on:
  workflow_run:
    workflows: ["Demo CI Pipeline"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/demo-ci.yml

  deploy-dev:
    name: Dev Stage
    needs: ci
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment-name: dev
    secrets: inherit

  deploy-uat:
    name: UAT Stage
    needs: deploy-dev
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment-name: uat
    secrets: inherit

  deploy-prod:
    name: Prod Stage
    needs: deploy-uat
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment-name: prod
    secrets: inherit
