name: Shared Deployment Blueprint

on:
  workflow_call:
    inputs:
      environment-name:
        required: true
        type: string
        description: "The targeted GitHub environment name (e.g., dev, uat, prod)"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment-name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-name }}

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Verify Build Artifact
        run: test -f dist/index.js

      - name: Copy build files to Windows VM via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          source: "dist/**,package.json,package-lock.json"
          target: "C:/apps/my-ts-app-100"

      - name: Install prod dependencies and restart PM2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            powershell -Command "
              cd C:\apps\my-ts-app-100;

              npm ci --omit=dev;

              pm2 restart my-ts-app || pm2 start dist/index.js --name my-ts-app;

              pm2 save
            "
name: Demo CICD Multi-Stage Deployment

on:
  workflow_run:
    workflows: ["Demo CI Pipeline"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/demo-ci.yml

  deploy-dev:
    name: Dev Stage
    needs: ci
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment-name: dev
    secrets: inherit

  deploy-uat:
    name: UAT Stage
    needs: deploy-dev
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment-name: uat
    secrets: inherit

  deploy-prod:
    name: Prod Stage
    needs: deploy-uat
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment-name: prod
    secrets: inherit
